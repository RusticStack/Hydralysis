[package]
name = "hy-views"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hydralysis project-mutation machinery (views, commits, working copies) in Rust"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.3"
thiserror = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

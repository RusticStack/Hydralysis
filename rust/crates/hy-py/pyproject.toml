[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "hydralysis-rs"
version = "0.1.0"
requires-python = ">=3.13"
description = "Rust implementation of the Hydralysis storage layer (differential testing / HYDRALYSIS_IMPL=rust)."

[tool.maturin]
module-name = "hydralysis_rs"
features = ["pyo3/extension-module"]

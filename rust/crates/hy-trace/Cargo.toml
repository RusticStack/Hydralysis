[package]
name = "hy-trace"
description = "Hydralysis semantic-trace tool logic (hash registry, reports, reply shaping, stall watchdog) in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
sha2.workspace = true
crc32fast.workspace = true
thiserror.workspace = true
memchr = "2"
fancy-regex = "0.20.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Foundation"] }

[lints]
workspace = true

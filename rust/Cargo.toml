# Rust rewrite of Hydralysis (RusticRE). Shared by every R-hy-* lane: keep `members = ["crates/*"]`.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
crc32fast = "1.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
rusqlite = { version = "0.37", features = ["bundled"] }
memmap2 = "0.9"
rayon = "1"
regex = "1"
capstone = "0.13"

[profile.release]
codegen-units = 1

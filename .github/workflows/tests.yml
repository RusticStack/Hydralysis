name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # RusticRE targets Windows PEs on Windows hosts; the engine integration tests stay local.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        env:
          PYTHONPATH: src
          RUSTICRE_TEST_ROOT: ${{ runner.temp }}\rusticre-tests
        run: python -m unittest discover -s tests -v

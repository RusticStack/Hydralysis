name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by full commit SHA; each SHA was read from the action repository's
# tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and the tag is named in the comment.
#   actions/checkout     v4.4.0 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-java   v4.9.1 -> cf277c60eb25467037889841efdb72551f06f6c3
#   actions/cache        v4.3.0 -> 0057852bfaa89a56745cba8c7296529d2fc39830
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  unit:
    # Hydralysis targets Windows PEs on Windows hosts. This job needs no engine, no JDK and no game data:
    # the whole unit suite, the synthetic golden-harness tests and the no-stock-Ghidra source scan run here.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    env:
      # The stock-Ghidra hook is scrubbed (empty is unset for Hydralysis, which tests it for truthiness);
      # the hermetic step below proves it.
      GHIDRA_INSTALL_DIR: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Hermetic - no stock Ghidra is visible
        run: python .github/scripts/ci_engine.py hermetic
      - name: Unit tests (includes the synthetic golden-harness tests)
        env:
          HYDRALYSIS_TEST_ROOT: ${{ runner.temp }}\hydralysis-tests
        run: python -m unittest discover -s tests -v

  engine:
    # The real engine: the pinned Hydra release, a JDK 25, every env-gated end-to-end test file (not three of them),
    # on the private repository's 2 vCPU / 8 GB runner. tools/run_tests.py sizes its workers from the processors
    # the runner grants (granted_cpus: max(2, CPUs - 2), 2 here) and runs a failed task again alone; --strict
    # makes a test that fails only under load a failure. Tests that need a helper client, a legacy project or game
    # data still skip (their variables are not set here).
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GHIDRA_INSTALL_DIR: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Install
        run: python -m pip install -e .
      - name: Read the pinned release from src/hydralysis/hydra.py
        id: pins
        run: python .github/scripts/ci_engine.py pins
      - name: Cache the pinned engine and client archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\hydra-root\downloads
          key: hydra-archives-${{ steps.pins.outputs.engine_sha }}-${{ steps.pins.outputs.client_sha }}
      - name: Download (on a cache miss), verify SHA-256, unpack
        run: python .github/scripts/ci_engine.py install "${{ runner.temp }}\hydra-root"
      - name: Hermetic - the pinned Hydra is the only engine; a stock-Ghidra variable is ignored
        run: python .github/scripts/ci_engine.py hermetic "${{ runner.temp }}\hydra-root" --java "$env:JAVA_HOME"
      - name: Build the fixtures (MSVC, x64 and x86; the linker maps are the ground truth)
        run: |
          python tests/fixtures/build_fixtures.py "${{ runner.temp }}\fixtures"
          "HYDRALYSIS_INTEGRATION_FIXTURES=${{ runner.temp }}\fixtures" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The runner's processors
        run: python -c "import os, sys; sys.path.insert(0, 'tools'); import run_tests; print(f'granted CPUs {run_tests.granted_cpus()} of {os.cpu_count()}')"
      - name: Every engine-gated test file, in parallel (Z1, Z4 and the rest)
        env:
          HYDRALYSIS_INTEGRATION_JAVA: ${{ env.JAVA_HOME }}
        run: python tools/run_tests.py --integration --strict --root "${{ runner.temp }}\hy-run" --keep
      - name: Harness audit (Z4)
        run: python tools/audit_harness.py --self --skills skills
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-test-logs
          path: ${{ runner.temp }}\hy-run
          if-no-files-found: ignore

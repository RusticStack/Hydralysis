name: release

# Dry run (workflow_dispatch): builds and checks everything, publishes nothing.
# Tag push (v*): the same, then a DRAFT release. This stream never tags; the owner does.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Pinned by full commit SHA, like tests.yml.
#   actions/checkout        v4.4.0 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python    v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-java     v4.9.1 -> cf277c60eb25467037889841efdb72551f06f6c3
#   actions/upload-artifact v4.6.2 -> ea165f8d65b6e75b540449e92b4886f43607fa02
# All four SHAs checked against their tags with `gh api repos/<action>/git/ref/tags/<tag>` on 2026-10-30.

jobs:
  # The unit and engine suites ran locally (unit + real-engine against the pinned engine) on the commit named in
  # .github/local-test-record.json. They are skipped here when every change from that commit to this one is a
  # document (*.md), a workflow file (.github/) or the record itself; any other change runs tests.yml as before.
  local:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.rec.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the local test record
        id: rec
        shell: bash
        run: |
          rec=.github/local-test-record.json
          tested=false
          if [ -f "$rec" ]; then
            commit=$(python3 -c "import json; print(json.load(open('$rec'))['testedCommit'])")
            if git merge-base --is-ancestor "$commit" HEAD; then
              other=$(git diff --name-only "$commit" HEAD | grep -v -E '\.md$|^\.github/' || true)
              if [ -z "$other" ]; then tested=true; else echo "changed since $commit, beyond documents:"; echo "$other"; fi
            else
              echo "::warning::$commit in $rec is not an ancestor of this commit"
            fi
            cat "$rec" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "Suites covered by the local record: $tested" >> "$GITHUB_STEP_SUMMARY"

  # The unit and engine jobs of tests.yml, the same as on main; the release build waits for both unless the local
  # record covers this commit.
  tests:
    needs: local
    if: needs.local.outputs.tested != 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [local, tests]
    if: always() && needs.local.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    # The draft release needs write access; a dry run never uses it.
    permissions:
      contents: write
    env:
      GHIDRA_INSTALL_DIR: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Install build tools and the package
        run: python -m pip install build -e .
      - name: Tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import hydralysis; print(hydralysis.__version__)")
          echo "package version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} differs from version ${version}"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Unit tests
        if: needs.local.outputs.tested != 'true'
        env:
          HYDRALYSIS_TEST_ROOT: ${{ runner.temp }}\hydralysis-tests
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist
      - name: SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Download and verify the pinned engine (the same helper as tests.yml)
        run: python .github/scripts/ci_engine.py install "${{ runner.temp }}\hydra-root"
      - name: Verify the wheel in a fresh environment
        shell: bash
        env:
          HYDRALYSIS_ROOT: ${{ runner.temp }}\hydra-root
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/Scripts/python.exe" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/fresh/Scripts/python.exe" -c "import hydralysis, os; v = os.environ['VERSION']; assert hydralysis.__version__ == v, hydralysis.__version__"
          "$RUNNER_TEMP/fresh/Scripts/hydralysis.exe" backend inspect | tee inspect.json
          "$RUNNER_TEMP/fresh/Scripts/python.exe" -c "import json; r = json.load(open('inspect.json')); assert r.get('ready') is True, r"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # A dry run keeps the files as an artifact; a tag push attaches them to the draft release instead
        # (artifact storage is a shared quota, and the release already holds the same files)
        if: github.ref_type != 'tag'
        with:
          name: hydralysis-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Draft release (tag push only; never published by this workflow)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The body is this version's CHANGELOG section only, not the whole file
          awk -v h="## ${VERSION}" '$0==h{on=1; next} on && /^## /{exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no '## ${VERSION}' section"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" dist/* --draft --title "Hydralysis ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"

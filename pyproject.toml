[project]
name = "hydralysis"
version = "0.6.0.dev0"
description = "Small reverse-engineering server: PE evidence, analysis setup, reusable saved-project queries and verified runtime sessions."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "KelpHect", email = "kellhect@gmail.com" }]
dependencies = [
  "pefile>=2024.8.18",
  "capstone>=5",
]

[project.scripts]
hydralysis = "hydralysis.cli:main"
# Compatibility alias for one release: existing MCP registrations and scripts call `rusticre`.
rusticre = "hydralysis.cli:main"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hydralysis = ["scripts/*.java"]

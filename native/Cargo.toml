[package]
name = "hydralysis-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional native helpers for Hydralysis (CRC-framed log scanning); pure-Python fallback in hydralysis.durable"

[lib]
name = "hydralysis_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py313"] }
crc32fast = "1.4"
memchr = "2.7"
sha2 = "0.10"
hmac = "0.12"
serde_json = "1"
itoa = "1"
hydra-client = { path = "vendor/hydra-client" }
hy-query = { path = "../rust/crates/hy-query" }
hy-views = { path = "../rust/crates/hy-views" }
hy-trace = { path = "../rust/crates/hy-trace" }

[profile.release]
lto = true
codegen-units = 1
